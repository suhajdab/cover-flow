<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Cover Flow</title>
  <meta name="description" content="Animated cover flow visualization for Goodreads bookshelves.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Content Security Policy (only security header that can be set via meta tag) -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' https://images-na.ssl-images-amazon.com https://*.goodreads.com https://i.gr-assets.com https://s.gr-assets.com; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://www.goodreads.com;">

  <!-- Preconnect to external resources -->
  <link rel="preconnect" href="https://images-na.ssl-images-amazon.com">
</head>

<body>
  <div id="cover-flow"></div>

  <div id="floating-card">
    <div id="channel-title"></div>
    <div id="progress-list">
      <div class="progress-item" id="progress-connect">
        <span class="progress-text">Connect to Goodreads</span>
        <span class="progress-status"></span>
      </div>
      <div class="progress-item" id="progress-fetch">
        <span class="progress-text">Fetch book data</span>
        <span class="progress-status"></span>
      </div>
      <div class="progress-item" id="progress-images">
        <span class="progress-text">Load cover images</span>
        <span class="progress-status"></span>
      </div>
    </div>
    <div id="progress-bar">
      <div id="progress-bar-inner"></div>
    </div>
    <div id="progress-text">*some books may not have accessible images</div>
  </div>

  <div id="goodreads-dialog" class="dialog-overlay hidden">
    <div class="dialog-content" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
      <h2 id="welcome-title">Welcome to Cover Flow</h2>
      <label for="goodreads-url-input">Goodreads profile or shelf URL</label>
      <form id="goodreads-form" class="input-group" novalidate>
        <input type="url" id="goodreads-url-input" placeholder="https://www.goodreads.com/user/show/…"
          aria-describedby="goodreads-help" required />
        <button id="submit-goodreads-url" type="submit" disabled>Load Books</button>
      </form>
      <p id="goodreads-help">Paste your public Goodreads profile link to load your Read shelf, or paste a shelf link to choose a different shelf.</p>
      <div class="github-link">
        <p>Want to contribute? Check out the <a href="https://github.com/suhajdab/cover-flow" target="_blank"
            rel="noopener noreferrer">GitHub repository</a></p>
      </div>
      <div id="goodreads-error" class="error-message hidden" role="alert"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/analytics.js"></script>
</body>

</html>
